name: SDK verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT_MANIFEST: ${{ vars.CONTRACT_MANIFEST_URL }}
  CONTRACT_MANIFEST_SHA256: ${{ vars.CONTRACT_MANIFEST_SHA256 }}

jobs:
  python-core:
    name: Python SDK core matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test base yoao-plugin-sdk without inference contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/python[dev]"
          yoao-plugin version
          python -m pytest packages/python/tests/test_sdk.py scripts/test_fetch_contracts.py -q

  python-mask:
    name: Python SDK mask utilities matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test mask utilities extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/python[mask,dev]"
          python -c 'import numpy as np; from yoao_plugin_sdk.inference.mask_utils import mask_to_polygon; assert mask_to_polygon(np.zeros((8, 8), dtype=np.uint8)) == []'
          python -m pytest --import-mode=importlib packages/python/tests/mask_utils -q

  python-inference-artifacts:
    name: Python SDK inference and contract artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Upstream yoao-inference-contract / yoao-training-contract currently declare >=3.11.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install committed artifacts
        run: |
          python -m pip install build 'setuptools>=68' wheel pytest pytest-asyncio
          python scripts/fetch-contracts.py --manifest "$CONTRACT_MANIFEST" --sha256 "$CONTRACT_MANIFEST_SHA256" --output "$RUNNER_TEMP/contracts"
          python scripts/build-sdk-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/sdk"
          python -m pip install "$RUNNER_TEMP"/contracts/*.whl
          for artifact in "$RUNNER_TEMP"/sdk/yoao_plugin_sdk-*.whl; do
            python -m pip install "${artifact}[inference,mask,qualification,dev]"
          done
      - name: Exercise unified Python SDK
        run: |
          yoao-plugin --help
          python -c 'from yoao_plugin_sdk.inference import Detection, create_detection_app; from yoao_plugin_sdk.inference.runtime import versions_payload; import numpy as np; from yoao_plugin_sdk.inference.mask_utils import mask_to_polygon; assert versions_payload("m", "b") == {"versions": ["m"], "backend_version": "b"}; assert mask_to_polygon(np.zeros((8, 8), dtype=np.uint8)) == []'
          python -m pytest --import-mode=importlib packages/python/tests scripts/test_fetch_contracts.py -q

  js-sdk:
    name: JS SDK Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run @yoao/plugin-sdk tests
        run: node --test packages/js/test/sdk.test.mjs
