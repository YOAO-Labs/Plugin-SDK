name: SDK verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-contracts:
    name: SDK runtime contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install committed artifacts
        run: |
          python -m pip install build 'setuptools>=68' wheel pytest
          python scripts/fetch-contracts.py "$RUNNER_TEMP/contracts"
          python scripts/build-sdk-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/sdk"
          python -m pip install "$RUNNER_TEMP"/contracts/*.whl "$RUNNER_TEMP"/sdk/aap_backend_runtime-*.whl
      - name: Exercise runtime
        run: |
          python -c 'from aap_backend_runtime import versions_payload; assert versions_payload("model", "backend") == {"versions": ["model"], "backend_version": "backend"}'
          python -m pytest packages/inference/runtime/tests
  inference-author-sdk:
    name: SDK inference authoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install committed artifacts
        run: |
          python -m pip install build 'setuptools>=68' wheel pytest pytest-asyncio
          python scripts/fetch-contracts.py "$RUNNER_TEMP/contracts"
          python scripts/build-sdk-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/sdk"
          python -m pip install "$RUNNER_TEMP"/contracts/*.whl "$RUNNER_TEMP"/sdk/aap_backend_runtime-*.whl "$RUNNER_TEMP"/sdk/aap_inference_plugin_sdk-*.whl
      - name: Exercise author SDK
        run: |
          python -c 'from aap_inference_plugin import Detection, create_detection_app; print(Detection.__name__, create_detection_app.__name__)'
          aap-inference-plugin --help
          python -m pytest packages/inference/sdk/tests
  inference-mask-utils:
    name: SDK mask utilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install committed artifacts
        run: |
          python -m pip install build 'setuptools>=68' wheel pytest
          python scripts/build-sdk-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/sdk"
          python -m pip install "$RUNNER_TEMP"/sdk/anno_mask_utils-*.whl
      - name: Exercise mask utilities
        run: |
          python -c 'import numpy as np; from mask_utils import mask_to_polygon; assert mask_to_polygon(np.zeros((8, 8), dtype=np.uint8)) == []'
          python -m pytest packages/inference/mask-utils/tests
