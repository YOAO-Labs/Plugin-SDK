name: Plugin SDK CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sdk:
    name: Python SDK matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test yoao-plugin-sdk
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/python[dev]"
          pytest packages/python/tests -q

  js-sdk:
    name: JS SDK Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run @yoao/plugin-sdk tests
        run: node --test packages/js/test/sdk.test.mjs
