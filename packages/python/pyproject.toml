[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoao-plugin-sdk"
dynamic = ["version"]
description = "Universal Python SDK for YOAO plugins across inference, trainers, notification channels, format adapters, and declarative themes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Torch and TorchVision are pinned by each consuming plugin's own environment or
# container image, never by this SDK.
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
inference-runtime = [
    "yoao-lifecycle-contract",
    "yoao-protocol-v2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "cryptography>=43.0.0",
    "pillow>=10.0",
]
inference = [
    "yoao-lifecycle-contract",
    "yoao-protocol-v2",
    "yoao-inference-contract",
    "httpx>=0.27",
    "fastapi>=0.115",
    "cryptography>=43.0.0",
    "pillow>=10.0",
    "uvicorn>=0.30",
]
mask = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "shapely>=2.0",
]
qualification = [
    "PyJWT>=2.8,<3",
    "uvicorn>=0.29",
]
notification = [
    "httpx>=0.27",
]
format = []
trainer = []
dev = [
    "build>=1.2,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "PyJWT>=2.8,<3",
    "uvicorn>=0.30",
]

[project.scripts]
yoao-plugin = "yoao_plugin_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "yoao_plugin_sdk._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
