[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoao-plugin-sdk"
dynamic = ["version"]
description = "Universal Python SDK and CLI scaffold for YOAO plugins (inference, notification channels, format adapters, and themes)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
inference = ["httpx>=0.27"]
notification = ["httpx>=0.27"]
format = []
dev = ["pytest>=8.0"]

[project.scripts]
yoao-plugin-sdk = "yoao_plugin_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "yoao_plugin_sdk._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
