[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoao-inference-plugin-sdk"
version = "0.1.0"
description = "Detection authoring tools for YOAO inference plugins"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["yoao-protocol-v2", "yoao-backend-runtime", "yoao-inference-contract", "cryptography>=43", "fastapi>=0.115", "httpx>=0.27", "pillow>=10", "pydantic>=2", "uvicorn>=0.30"]

[project.scripts]
yoao-plugin = "yoao_inference_plugin.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

