[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoao-backend-runtime"
version = "0.1.0"
description = "推理插件共享运行时：输入读取、取消安全模型池、有状态追踪与受控 GPU 生命周期"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Torch and TorchVision are pinned by each consuming plugin's environment or image,
# not by this shared runtime. Installing the runtime must not replace those pins.
# HTTP input fetching and image decoding use the declared HTTPX and Pillow dependencies.
dependencies = [
    "yoao-lifecycle-contract",
    "yoao-protocol-v2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "cryptography>=43.0.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
qualification = ["PyJWT>=2.8,<3", "uvicorn>=0.29"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "PyJWT>=2.8,<3", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

